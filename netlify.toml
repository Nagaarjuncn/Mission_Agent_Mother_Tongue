# ==============================================================================
# Netlify Configuration for VernacLearn AI Platform
# ==============================================================================

[build]
  # Publish root directory containing index.html, js/, styles/
  publish = "."

# Production Headers: Security, Performance Caching & Mobile Microphone Access
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Enable microphone access across browser origins for speech recognition & voice learning
    Permissions-Policy = "microphone=(self \"*\"), camera=(), geolocation=()"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Single-Page Application (SPA) Client-Side Navigation Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
